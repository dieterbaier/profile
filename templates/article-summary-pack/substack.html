<article lang="de" class="summary summary-substack" data-platform="substack">
  <h1>{{title}}</h1>
  <p class="summary-subtitle">{{subtitle}}</p>

  <section class="summary-body">
{{summary}}
  </section>

  <p class="summary-cta">{{cta}}</p>
  <p class="summary-tags">{{tags}}</p>

  <section class="summary-notes">
    <h2>notes</h2>
    <ul>
{{notes}}
    </ul>
  </section>
</article>

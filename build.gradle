tasks.register('verifyNoArticleSummariesInGeneratedOutputs') {
    mustRunAfter tasks.named('buildSite')
    mustRunAfter tasks.named('buildArticlesMarkdown')

    doLast {
        def generatedTargets = [
                layout.buildDirectory.dir('site').get().asFile,
                layout.buildDirectory.dir('articles').get().asFile
        ]
        def summaryReferencePattern = ~/_summary_[A-Za-z0-9-]+/
        def textExtensions = ['.adoc', '.css', '.html', '.js', '.json', '.md', '.txt', '.xml', '.yaml', '.yml']
        def violations = []

        generatedTargets.findAll { it.exists() }.each { target ->
            fileTree(target) {
                include '**/*'
                exclude '**/media/**'
                exclude '**/assets/**'
                exclude '**/stylesheet/**'
            }.files.each { File candidate ->
                if (candidate.name.contains('_summary_')) {
                    violations << "summary file generated: ${rootDir.toPath().relativize(candidate.toPath())}"
                    return
                }

                if (candidate.isFile() && textExtensions.any { candidate.name.endsWith(it) } && candidate.length() < 5_000_000L) {
                    def content = candidate.getText('UTF-8')
                    if (summaryReferencePattern.matcher(content).find()) {
                        violations << "summary reference generated: ${rootDir.toPath().relativize(candidate.toPath())}"
                    }
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException("Article summaries must not be part of generated site or article outputs:\n- ${violations.join('\n- ')}")
        }
    }
}


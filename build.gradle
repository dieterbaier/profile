}

def articleSummarySourceExcludes = [
        '**/*_summary_*.adoc',
        '**/*_summary_*.md',
        '**/*_summary_*.html'
]

// Article sources the public target must not render, as repository-relative
// paths. Ruby owns the metadata contract, so the selection is asked for rather
// than reimplemented here.
//
// This runs while the build configures itself, not while it executes. The
// Asciidoctor plugin resolves a task's source tree when it determines that
// task's dependencies, which is before any generator has run: a list written
// during the build would be missing exactly when a clean build needs it. That
// is the same failure class as the article list pages that once pointed at a
// mid-build directory, and configuration time removes it rather than ordering
// around it.
def publicArticleExclusions = { ->
    def stdout = new StringWriter()
    def stderr = new StringWriter()
    def process = ['ruby', 'scripts/validate-profile-metamodel.rb', '--list-public-source-exclusions']
            .execute(null, rootDir)
    process.waitForProcessOutput(stdout, stderr)

    // Fail closed. Without a trustworthy list the safe answer is to render
    // nothing, not to render everything.
    if (process.exitValue() != 0) {
        throw new GradleException(
                'Could not determine which articles the public target may render.\n' +
                        "ruby scripts/validate-profile-metamodel.rb --list-public-source-exclusions failed:\n${stderr}")
    }

    stdout.toString().readLines().findAll { !it.trim().isEmpty() }.toSet()
}()

// The asset directories the public target may publish, asked of the same owner
// of the metadata contract and at the same time as the selection above, so a
// page and the files it asks for are chosen by one rule rather than two.
def publicArticleAssetDirs = { ->
    def stdout = new StringWriter()
    def stderr = new StringWriter()
    def process = ['ruby', 'scripts/validate-profile-metamodel.rb', '--list-target-asset-dirs', '--target', 'public']
            .execute(null, rootDir)
    process.waitForProcessOutput(stdout, stderr)

    if (process.exitValue() != 0) {
        throw new GradleException(
                'Could not determine which article assets the public target may publish.\n' +
                        "ruby scripts/validate-profile-metamodel.rb --list-target-asset-dirs failed:\n${stderr}")
    }

    stdout.toString().readLines().findAll { !it.trim().isEmpty() }.collect { file(it) }
}()

// Asked of a rendered target rather than of the selection that produced it, the
// same way the publication status is asked twice. A target can hold the right
// assets in the wrong place — the Markdown export moves them while it converts —
// and no renderer reports that, because a missing image reaches the reader
// rather than the build.
// `afterTasks` names what writes into the target last, usually the copy that
// puts the assets there. Finalizers of one task are not ordered against each
// other, so without this the check runs against a half-written target and
// reports files that the build was still about to copy. The first version of
// this did exactly that.
def verifyAssetReferences = { taskName, targetDir, label, List<String> afterTasks ->
    tasks.register(taskName) {
        description = "Fails when a page in ${label} asks for a file that target does not contain."
        group = 'verification'
        inputs.file('scripts/verify-rendered-asset-references.rb')
        afterTasks.each { mustRunAfter tasks.named(it) }

        doLast {
            exec {
                commandLine 'ruby', 'scripts/verify-rendered-asset-references.rb',
                        '--target-dir', file(targetDir).absolutePath,
                        '--label', label
            }
        }
    }
}


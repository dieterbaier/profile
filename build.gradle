    finalizedBy tasks.named('verifyNoArticleSummariesInGeneratedOutputs')
    finalizedBy tasks.named('verifyPublicTargetHasOnlyPublishedArticles')
    finalizedBy tasks.named('verifyArticlesAssetReferences')
}

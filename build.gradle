    id 'org.asciidoctor.jvm.convert' version '4.0.5'
    id 'org.asciidoctor.jvm.pdf' version '4.0.5'
}

repositories {
    mavenCentral()
}

abstract class PandocTask extends DefaultTask {

    @InputFile
    abstract RegularFileProperty getInputFile()

    @OutputFile
    abstract RegularFileProperty getOutputFile()

    @TaskAction
    void runPandoc() {
        project.exec {
            commandLine 'pandoc',
                    inputFile.get().asFile,
                    '-f', 'docbook',
                    '-t', 'gfm',
                    '--wrap=none',
                    '--extract-media=build/pandoc/media',
                    '-o', outputFile.get().asFile
        }
    }
}

abstract class PandocDirectoryTask extends DefaultTask {

    @InputDirectory
    abstract DirectoryProperty getInputDirectory()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void runPandoc() {
        def sourceDirectory = inputDirectory.get().asFile
        def targetDirectory = outputDirectory.get().asFile

        project.fileTree(sourceDirectory) {
            include '**/*.xml'
        }.each { File input ->
            def relativePath = sourceDirectory.toPath().relativize(input.toPath()).toString()
            def markdownPath = relativePath.replaceFirst(/\.xml$/, '.md')
            def output = new File(targetDirectory, markdownPath)
            def mediaDirectory = new File(targetDirectory, 'media')
            def relativeMediaPath = output.parentFile.toPath().relativize(mediaDirectory.toPath()).toString()
            output.parentFile.mkdirs()

            project.exec {
                workingDir output.parentFile
                commandLine 'pandoc',
                        input.absoluteFile,
                        '-f', 'docbook',
                        '-t', 'gfm',
                        '--wrap=none',
                        '--resource-path', input.parentFile.absoluteFile,
                        '--extract-media', relativeMediaPath,
                        '-o', output.name
            }
        }
    }
}

def commandExists = { String command, String versionArgument ->
    try {
        def result = new ByteArrayOutputStream()
        exec {
            commandLine command, versionArgument
            standardOutput = result
            errorOutput = result
            ignoreExitValue = true
        }
        return !result.toString().isEmpty()
    } catch(Exception e) {
        e.printStackTrace()
        return false
    }
}

def envFile = file(".env")
def localEnv = new Properties()
if (envFile.exists()) {
    envFile.withReader("UTF-8") { localEnv.load(it) }
}

def env = { String key, String defaultValue = null ->
    System.getenv(key) ?: localEnv[key] ?: defaultValue
}

def articleSummarySourceExcludes = [
        '**/*_summary_*.adoc',
        '**/*_summary_*.md',
        '**/*_summary_*.html'
]

tasks.register('checkEnvironment') {
    doLast {
        def missing = []

        if (!commandExists('java', '-version')) {
            missing << 'java'
        }

        if (!commandExists('pandoc', '--version')) {
            missing << 'pandoc'
        }

        if (!commandExists('dot', '-V')) { // graphviz
            missing << 'graphviz (dot)'
        }

        if (!commandExists('node', '--version')) {
            missing << 'node'
        }

        if (!missing.isEmpty()) {
            throw new GradleException('''
❌ Missing required tools:
- ''' + missing.join('\n' +
                    '- ') + '''

👉 Bitte installieren und PATH prüfen.
''')
        }

        println "✅ Environment looks good"
    }
}

tasks.register('housekeeping', Delete) {
    delete layout.buildDirectory.dir("tmp")
    delete fileTree(rootProject.layout.buildDirectory) {
        include '**/.asciidoctorconfig.*'
    }
}

// gemeinsame Konfiguration
def asciidoctorBase = { taskName, taskDependsOnTask, sourceDir, outputDir, List<String> sourcesToBuild, clean = false, backend = "html5", extraAttrs = [:] ->
    var asciidocAttributes = ['includesdir': 'src-content/profile/includes',
                      'buildsite': 'true',
                      'skip-front-matter': '',
    ] + extraAttrs

    def taskProvider
    if (backend == 'docbook' || backend == 'html5') {
        taskProvider = tasks.register(taskName, org.asciidoctor.gradle.jvm.AsciidoctorTask) {
            setSourceDir(file(sourceDir))
            setOutputDir(file(outputDir))
            attributes(asciidocAttributes)
            if (!sourcesToBuild.isEmpty()) {
                sources {
                    setIncludes(sourcesToBuild)
                }
            }
            sources {
                articleSummarySourceExcludes.each { exclude it }
            }

            asciidoctorj {
                modules {
                    diagram.use()
                }
            }
            if (backend == 'docbook') {
                outputOptions {
                    backends = ['docbook']
                }
            }
        }
    }
    else  {
        taskProvider = tasks.register(taskName, org.asciidoctor.gradle.jvm.pdf.AsciidoctorPdfTask) {
            setSourceDir(file(sourceDir))
            setOutputDir(file(outputDir))
            attributes(asciidocAttributes)
            if (!sourcesToBuild.toList().isEmpty()) {
                sources {
                    setIncludes(sourcesToBuild)
                }
            }
            sources {
                articleSummarySourceExcludes.each { exclude it }
            }
        }
    }

    def copyTask = tasks.register("${taskName}CopyAssets", Copy) {
        dependsOn taskProvider

        into(taskProvider.map { it.outputDir })

        from("src-content/theme") {
            include "*.css"
            into "stylesheet"
        }

        from("src-content/theme") {
            include "*.js"
            into "stylesheet"
        }

        from("src-content/theme") {
            include "favicon.ico"
            into "."
        }

        from("src-content/theme") {
            include ".htaccess"
            into "."
        }

        from("src-content/theme/fonts") {
            include "*.woff2"
            into "stylesheet/fonts"
        }

        from("src-content/theme/icons") {
            into "assets/icons"
        }

        from("src-content/profile/includes/images") {
            into "assets/images"
        }

    }

    def cleanTask = tasks.register("${taskName}Clean", Delete) {
        delete outputDir
    }

    if (backend == 'pdf') {
        taskProvider.configure {finalizedBy("housekeeping")}
    } else {
        taskProvider.configure {finalizedBy(copyTask,"housekeeping")}
    }

    if (clean) {
        tasks.named(taskName) {
            dependsOn cleanTask
        }
    }
    tasks.named(taskName) {
        dependsOn tasks.named('checkEnvironment')
    }
    if(taskDependsOnTask != '') {
        tasks.named(taskName) {
            dependsOn tasks.named(taskDependsOnTask)
        }
    }
}


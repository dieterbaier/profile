// Files an article's asset directory holds for the build rather than for the
// reader: diagram sources the renderer compiles into the page, fragments it
// inlines, and what a file manager leaves behind. Everything else is published.
//
// A deny-list rather than an allow-list of image types, so a format the site has
// not used before works by being committed. An allow-list would drop it without
// saying so, which is the failure this whole convention exists to remove.
def articleAssetBuildInputs = ['**/*.puml', '**/*.dot', '**/*.adoc', '**/.DS_Store']

// gemeinsame Konfiguration
// `articleAssetDirs` names the per-article asset directories this target may
// publish, as absolute paths below `sourceDir`. They are copied to the position
// they hold in the source tree, so a page and the files it asks for keep the
// same relative arrangement before and after rendering — which is what lets an
// article address them without an attribute, and keeps that reference correct
// when the article is promoted from the private repository to this one.
def asciidoctorBase = { taskName, taskDependsOnTask, sourceDir, outputDir, List<String> sourcesToBuild, clean = false, backend = "html5", extraAttrs = [:], List<File> articleAssetDirs = [] ->
    var asciidocAttributes = ['includesdir': 'src-content/profile/includes',
                      'buildsite': 'true',
                      'skip-front-matter': '',
    ] + extraAttrs

    def taskProvider
    if (backend == 'docbook' || backend == 'html5') {
        taskProvider = tasks.register(taskName, org.asciidoctor.gradle.jvm.AsciidoctorTask) {
            setSourceDir(file(sourceDir))
            setOutputDir(file(outputDir))
            attributes(asciidocAttributes)
            if (!sourcesToBuild.isEmpty()) {
                sources {
                    setIncludes(sourcesToBuild)
                }
            }
            sources {
                if (sourcesToBuild.isEmpty()) {
                    // Repository convention: authored AsciiDoc sources use the canonical .adoc extension.
                    include '**/*.adoc'
                }
                articleSummarySourceExcludes.each { exclude it }
                exclude '**/generated/**'
            }

            asciidoctorj {
                modules {
                    diagram.use()
                }
            }
            if (backend == 'docbook') {
                outputOptions {
                    backends = ['docbook']
                }
            }
        }
    }
    else  {
        taskProvider = tasks.register(taskName, org.asciidoctor.gradle.jvm.pdf.AsciidoctorPdfTask) {
            setSourceDir(file(sourceDir))
            setOutputDir(file(outputDir))
            attributes(asciidocAttributes)
            if (!sourcesToBuild.toList().isEmpty()) {
                sources {
                    setIncludes(sourcesToBuild)
                }
            }
            sources {
                articleSummarySourceExcludes.each { exclude it }
                exclude '**/generated/**'
            }
        }
    }

    def copyTask = tasks.register("${taskName}CopyAssets", Copy) {
        dependsOn taskProvider

        into(taskProvider.map { it.outputDir })

        from("src-content/theme") {
            include "*.css"
            into "stylesheet"
        }

        from("src-content/theme") {
            include "*.js"
            into "stylesheet"
        }

        from("src-content/theme") {
            include "favicon.ico"
            into "."
        }

        from("src-content/theme") {
            include ".htaccess"
            into "."
        }

        from("src-content/theme/fonts") {
            include "*.woff2"
            into "stylesheet/fonts"
        }

        from("src-content/theme/icons") {
            into "assets/icons"
        }

        from("src-content/profile/includes/images") {
            into "assets/images"
        }

        // Each asset directory keeps its place relative to the article that owns
        // it. Nothing here decides which directories those are: the selection
        // follows the article's status, so an article a target must not carry
        // cannot leave its images behind in that target either.
        //
        // Callers pass the whole selection for a publication target, and a task
        // takes the part of it that lies below the tree it renders. The targets
        // do not all render the same tree — the Markdown export reads only the
        // default-language articles — so a directory outside this one belongs to
        // an article this task does not render, which is an ordinary state and
        // not a misplaced file. A directory no article claims at all is caught
        // by the validator, where the metadata to judge it lives.
        def assetSourceRoot = file(sourceDir).toPath().toAbsolutePath().normalize()
        articleAssetDirs.collect { it.toPath().toAbsolutePath().normalize() }
                .findAll { it.startsWith(assetSourceRoot) }
                .each { assetPath ->
                    from(assetPath.toFile()) {
                        into assetSourceRoot.relativize(assetPath).toString()
                        articleAssetBuildInputs.each { exclude it }
                    }
                }

    }

    def cleanTask = tasks.register("${taskName}Clean", Delete) {
        delete outputDir
    }

    if (backend == 'pdf') {
        taskProvider.configure {finalizedBy("housekeeping")}
    } else {
        taskProvider.configure {finalizedBy(copyTask,"housekeeping")}
    }

    if (clean) {
        tasks.named(taskName) {
            dependsOn cleanTask
        }
    }
    tasks.named(taskName) {
        dependsOn tasks.named('checkEnvironment')
    }
    if(taskDependsOnTask != '') {
        tasks.named(taskName) {
            dependsOn tasks.named(taskDependsOnTask)
        }
    }
}


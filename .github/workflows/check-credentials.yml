name: Check credentials

# A deployment only proves a credential when its job really runs, and a job only
# runs when its paths changed. This workflow proves every deployment credential
# without changing any target, and warns before a GitHub token expires.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  check-article-comments-token:
    runs-on: ubuntu-latest
    env:
      CHECK_TOKEN: ${{ secrets.ARTICLE_COMMENTS_REPO_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Check expiry
        run: ruby scripts/check-token-expiry.rb dieterbaier/profile-artikelkommentare

      - name: Check write access
        run: scripts/check-git-write-access.sh github.com/dieterbaier/profile-artikelkommentare.git x-access-token

  check-profile-repo-token:
    runs-on: ubuntu-latest
    env:
      CHECK_TOKEN: ${{ secrets.PROFILE_REPO_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Check expiry
        run: ruby scripts/check-token-expiry.rb dieterbaier/dieterbaier

      - name: Check write access
        run: scripts/check-git-write-access.sh github.com/dieterbaier/dieterbaier.git x-access-token

  check-gitlab-token:
    runs-on: ubuntu-latest
    env:
      CHECK_TOKEN: ${{ secrets.GITLAB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Check write access
        run: scripts/check-git-write-access.sh gitlab.com/brdietdidi/brdietdidi.git oauth2

  check-sftp-password:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      SFTP_HOST: ${{ vars.SFTP_HOST }}
      SFTP_PORT: ${{ vars.SFTP_PORT }}
      SFTP_USER: ${{ vars.SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_REMOTE_BASE: ${{ vars.SFTP_REMOTE_BASE }}

    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Check login
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" sftp://$SFTP_HOST:$SFTP_PORT <<EOF
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          cls -1 ${SFTP_REMOTE_BASE}
          bye
          EOF

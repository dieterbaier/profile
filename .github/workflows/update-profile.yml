name: Build Docs

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-private-space-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      readme: ${{ steps.filter.outputs.readme }}
      articles: ${{ steps.filter.outputs.articles }}
      architecture: ${{ steps.filter.outputs.architecture }}
      site: ${{ steps.filter.outputs.site }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            readme:
              - 'src-content/profile/**'
              - 'metamodel/profile-artifact.schema.yaml'
              - 'scripts/validate-profile-metamodel.rb'
              - 'build.gradle'
            articles:
              - 'src-content/profile/site/articles/**'
              - 'metamodel/profile-artifact.schema.yaml'
              - 'scripts/validate-profile-metamodel.rb'
              - 'build.gradle'
            architecture:
              - 'src-content/docs/**'
              - 'metamodel/**'
              - 'scripts/validate-metamodel.rb'
              - 'templates/**'
              - 'build.gradle'
              - 'AGENTS.md'
              - 'general-semantic-contracts.md'
              - 'ai-contracts/**'
              - 'skills/**'
              - 'adapters/**'
            site:
              - 'src-content/profile/**'
              - 'metamodel/profile-artifact.schema.yaml'
              - 'scripts/validate-profile-metamodel.rb'
              - 'build.gradle'
              - 'AGENTS.md'
              - 'general-semantic-contracts.md'
              - 'ai-contracts/**'
              - 'skills/**'
              - 'adapters/**'

  build-docs:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    environment:
      name: production
    env:
      SITE_EMAIL: ${{ secrets.SITE_EMAIL }}
      SITE_ADDRESS_NAME: ${{ secrets.SITE_ADDRESS_NAME }}
      SITE_STREET: ${{ secrets.SITE_STREET }}
      SITE_PLZ: ${{ secrets.SITE_PLZ }}
      SITE_CITY: ${{ secrets.SITE_CITY }}
      SITE_TEL: ${{ secrets.SITE_TEL }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      REQUIRE_SITE_BASE_URL: 'true'
    outputs:
      isBuilt: ${{ steps.run_build.outputs.IS_BUILT }}
    if: github.event_name != 'pull_request' && (needs.detect-changes.outputs.readme == 'true' || needs.detect-changes.outputs.articles == 'true' || needs.detect-changes.outputs.architecture == 'true' || needs.detect-changes.outputs.site == 'true')

    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: $HOME/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Run build
        id: run_build
        run: |
          TASKS=""

          if [ "${{ needs.detect-changes.outputs.readme }}" == "true" ]; then
            TASKS="$TASKS buildReadme"
          fi

          if [ "${{ needs.detect-changes.outputs.articles }}" == "true" ]; then
            TASKS="$TASKS buildArticlesMarkdown"
          fi

          if [ "${{ needs.detect-changes.outputs.architecture }}" == "true" ]; then
            TASKS="$TASKS buildArchitecture"
          fi

          if [ "${{ needs.detect-changes.outputs.site }}" == "true" ]; then
            TASKS="$TASKS buildSite"
          fi

          TASKS="$(echo "$TASKS" | xargs)"

          if [ -z "$TASKS" ]; then
            echo "IS_BUILT=false" >> $GITHUB_OUTPUT
            echo "Nothing to build"
            exit 0
          fi

          echo "IS_BUILT=true" >> $GITHUB_OUTPUT

          # The build runs through build.sh so CI and local builds share one
          # container invocation and image tag. Forward the Gradle cache to the
          # cached host directory.
          export GRADLE_CACHE="$HOME/.gradle"
          echo "Running: ./build.sh $TASKS"
          ./build.sh $TASKS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: steps.run_build.outputs.IS_BUILT == 'true'
        with:
          name: docs
          path: build/

  pr-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: $HOME/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'settings.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Run validation and generator checks
        run: |
          export GRADLE_CACHE="$HOME/.gradle"
          ./build.sh \
            validateProfileMetamodel \
            generateProfileArtifacts \
            generateArchitectureArtifacts \
            generateArticleSummaries \
            checkAgentAdapters \
            testAgentAdapters \
            testProfileNavigation \
            testProfileListings \
            testProfileComments \
            testProfileMetadataVersion \
            testProfilePrivateTarget \
            testPrivateCheckoutContract \
            testSiteMetadata

  deploy-site:
    needs: [build-docs, detect-changes]
    runs-on: ubuntu-latest
    if: needs.build-docs.outputs.isBuilt == 'true' && needs.detect-changes.outputs.site == 'true'
    environment:
      name: production
    env:
      SFTP_HOST: ${{ vars.SFTP_HOST }}
      SFTP_PORT: ${{ vars.SFTP_PORT }}
      SFTP_USER: ${{ vars.SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_REMOTE_BASE: ${{ vars.SFTP_REMOTE_BASE }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs
          path: build

      - name: Checkout article comments repository
        uses: actions/checkout@v4
        with:
          repository: dieterbaier/profile-artikelkommentare
          token: ${{ secrets.ARTICLE_COMMENTS_REPO_TOKEN }}
          path: article-comments-repo

      - name: Synchronize published article IDs
        run: |
          mkdir -p article-comments-repo/config
          cp build/article-comments/allowed-article-ids.json article-comments-repo/config/allowed-article-ids.json
          cd article-comments-repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add config/allowed-article-ids.json
          git commit -m "Update published article IDs" || echo "no changes"
          git push origin HEAD:main

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy site to private webspace
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" sftp://$SFTP_HOST:$SFTP_PORT <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror -R --delete --verbose ./build/site ${SFTP_REMOTE_BASE}/site
          bye
          EOF

  deploy-architecture:
    needs: [build-docs, detect-changes]
    runs-on: ubuntu-latest
    if: needs.build-docs.outputs.isBuilt == 'true' && needs.detect-changes.outputs.architecture == 'true'
    environment:
      name: production
    env:
      SFTP_HOST: ${{ vars.SFTP_HOST }}
      SFTP_PORT: ${{ vars.SFTP_PORT }}
      SFTP_USER: ${{ vars.SFTP_USER }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_REMOTE_BASE: ${{ vars.SFTP_REMOTE_BASE }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs
          path: build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy architecture to private webspace
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" sftp://$SFTP_HOST:$SFTP_PORT <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror -R --delete --verbose ./build/architecture ${SFTP_REMOTE_BASE}/architecture
          bye
          EOF

  deploy-github-readme:
    needs: [build-docs, detect-changes]
    runs-on: ubuntu-latest
    if: needs.build-docs.outputs.isBuilt == 'true' && needs.detect-changes.outputs.readme == 'true'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs
          path: build

      - name: checkout github profile repo
        uses: actions/checkout@v4
        with:
          repository: dieterbaier/dieterbaier
          token: ${{ secrets.PROFILE_REPO_TOKEN }}
          path: profile

      - name: update readme on profile repo
        run: |
          cp build/readme/README.md profile/README.md
          cd profile
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "update README" || echo "no changes"
          git push origin HEAD:main

  deploy-gitlab-readme:
    needs: [build-docs, detect-changes]
    runs-on: ubuntu-latest
    if: needs.build-docs.outputs.isBuilt == 'true' && needs.detect-changes.outputs.readme == 'true'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs
          path: build

      - name: push readme to gitlab profile
        run: |
          git clone https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/brdietdidi/brdietdidi.git gitlab-repo
          cp build/readme/README.md gitlab-repo/README.md
          cd gitlab-repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "update README" || echo "no changes"
          git push origin HEAD:main

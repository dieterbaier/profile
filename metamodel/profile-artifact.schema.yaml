$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://dieterbaier.eu/metamodel/profile-artifact.schema.yaml"
title: Profile Artifact Metadata
description: Metadata for personal profile artifacts authored as source content.
type: object
additionalProperties: false
required:
  - id
  - type
  - title
  - status
  - owner
  - created
properties:
  id:
    type: string
    pattern: "^[A-Z]+-[0-9]{3,}(-[a-z0-9]+)*$"
  type:
    type: string
    enum:
      - ProfilePage
      - Article
      - ShortThought
      - CV
      - Project
      - ProfessionalExperience
      - Education
      - Skill
      - Contact
      - ProfileFragment
  title:
    type: string
    minLength: 1
  status:
    type: string
    enum: [draft, proposed, preview, reviewed, published, private, archived, deprecated]
  owner:
    type: string
    minLength: 1
  created:
    type: string
    format: date
  updated:
    type: string
    format: date
  published:
    type: string
    format: date
    description: >-
      Optional publication date. Article listings display this date and sort by
      it; when absent, listings fall back to 'created'.
  reviewed:
    type: boolean
    default: false
  generated:
    type: boolean
    default: false
  language:
    type: string
    description: >-
      Language the artifact is written in. Must be a concrete language; an
      artifact cannot be authored in several languages at once, because a page
      may only include fragments of its own language. Absent means the default
      language 'de'. The declared value must match the artifact's location:
      default-language artifacts live at the root of their tree, every other
      language below its own '<lang>/' subtree.
    enum: [de, en]
  translation_of:
    type: string
    description: >-
      Stable ID of the artifact this one was translated from. Absent means this
      artifact is an original. The original may be in any language and does not
      have to be the default language; an article can be written in English
      first and translated into German afterwards.
    pattern: "^[A-Z]+-[0-9]{3,}(-[a-z0-9]+)*$"
  translation_source_digest:
    type: string
    description: >-
      Digest of the original's full source content at the time this translation
      was written or last re-accepted. The generator recomputes it to derive
      whether the translation is still in sync. Only valid together with
      'translation_of'.
    pattern: "^[0-9a-f]{64}$"
  translation_divergence:
    type: string
    minLength: 1
    description: >-
      Author-declared description of a deliberate content difference from the
      original. Its presence marks the translation as intentionally divergent
      and is shown to the reader independently of the freshness state. Only
      valid together with 'translation_of'.
  audience:
    type: array
    items:
      type: string
  channels:
    type: array
    items:
      type: string
      enum: [website, cv, readme, github, gitlab, markdown-export, pdf]
  summary:
    type: string
    description: >-
      Language-neutral fallback summary. Listings prefer the language-specific
      'summary_de'/'summary_en' and fall back to this value when the requested
      language variant is absent.
  summary_de:
    type: string
    description: German summary shown in German article listings.
  summary_en:
    type: string
    description: English summary shown in English article listings.
  source:
    type: string
  tags:
    type: array
    uniqueItems: true
    items:
      type: string
      description: >-
        Any capitalization is allowed. Restricted to letters, digits, and
        hyphens so tags carry no blanks or special characters.
      pattern: "^[A-Za-z0-9][A-Za-z0-9-]*$"
  skills:
    type: array
    uniqueItems: true
    items:
      type: string
      description: >-
        Skill slug an article demonstrates. Kept separate from 'tags'. Restricted
        to letters, digits, and hyphens so it is URL- and filename-safe; the
        overview page derives its heading by turning hyphens into spaces.
      pattern: "^[A-Za-z0-9][A-Za-z0-9-]*$"
  previous:
    type: string
    description: >-
      Optional stable ID of the preceding artifact in an article series. Used to
      render "previous article" navigation. Only valid on Article artifacts and
      must reference an existing Article.
    pattern: "^[A-Z]+-[0-9]{3,}(-[a-z0-9]+)*$"
  next:
    type: string
    description: >-
      Optional stable ID of the following artifact in an article series. Used to
      render "next article" navigation. Only valid on Article artifacts and must
      reference an existing Article.
    pattern: "^[A-Z]+-[0-9]{3,}(-[a-z0-9]+)*$"
  relations:
    type: array
    items:
      $ref: "relations.schema.yaml#/$defs/relation"
  metadata_version:
    type: string
    default: "1.0"
allOf:
  # Article-series navigation is only meaningful for articles.
  - if:
      required: [type]
      properties:
        type:
          const: Article
    then: true
    else:
      properties:
        previous: false
        next: false
